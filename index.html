<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #171717, #141414);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .viewer-container {
            flex: 1;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #viewer {
            width: 100%;
            height: 100%;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px 40px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #4facfe;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            max-width: 300px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-title {
            color: #4facfe;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-list {
            list-style-type: none;
        }
        
        .info-list li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-icon {
            color: #4facfe;
            font-weight: bold;
            font-size: 18px;
        }
        
        .title {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 32px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
        }
        
        .status-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b6b;
        }
        
        .status-indicator.active {
            background: #4facfe;
            box-shadow: 0 0 10px #4facfe;
        }
        
        .model-info {
            position: absolute;
            top: 70px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .model-info h3 {
            color: #4facfe;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            min-width: 250px;
        }
        
        .info-label {
            opacity: 0.8;
        }
        
        .info-value {
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }
            
            .viewer-container {
                border-radius: 0;
            }
            
            .controls-info {
                font-size: 14px;
                bottom: 10px;
                left: 10px;
                max-width: 250px;
            }
            
            .title {
                font-size: 24px;
                top: 10px;
            }
            
            .status-bar {
                top: 10px;
                right: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">3D Model Viewer</div>
        
        <div class="viewer-container">
            <div id="viewer"></div>
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Loading model...</p>
            </div>
        </div>
        
        <div class="status-bar" id="statusBar">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Loading...</span>
        </div>
        
        <!-- <div class="model-info">
            <h3>📁 Model Info</h3>
            <div class="info-row">
                <span class="info-label">File name:</span>
                <span class="info-value" id="fileName">my-room.glb</span>
            </div>
            <div class="info-row">
                <span class="info-label">Status:</span>
                <span class="info-value" id="fileStatus">Loading...</span>
            </div>
        </div> -->
    </div>

    <script>
        let scene, camera, renderer, controls, model;
        const modelPath = 'my-room.glb';
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 5, 15);
            
            camera = new THREE.PerspectiveCamera(
                75, 
                window.innerWidth / window.innerHeight, 
                0.1, 
                1000
            );
            camera.position.set(0, 0, 5);
            
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true
            });
            renderer.setSize(
                document.querySelector('.viewer-container').offsetWidth, 
                document.querySelector('.viewer-container').offsetHeight
            );
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('viewer').appendChild(renderer.domElement);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5,5,5);
            scene.add(directionalLight);
            
            const pointLight1 = new THREE.PointLight(0x4facfe, 1, 20);
            pointLight1.position.set(3, 3, 3);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0x888888, 1, 20);
            pointLight2.position.set(-3, -3, -3);
            scene.add(pointLight2);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;
            controls.zoomSpeed = 1.2;
            controls.panSpeed = 0.8;
            controls.minDistance = 0.1;
            controls.maxDistance = 100;
            
            renderer.domElement.addEventListener('dblclick', resetView);
            window.addEventListener('resize', onWindowResize);
            loadModel();
        }
        
        function loadModel() {
            document.getElementById('statusText').textContent = 'Loading...';
            
            const loader = new THREE.GLTFLoader();

            loader.load(
                modelPath,
                function(gltf) {
                    model = gltf.scene;
                    
                    centerModel(model);
                    scene.add(model);
                    
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('statusText').textContent = 'Loaded successfully';
                    document.getElementById('statusIndicator').classList.add('active');
                    document.getElementById('fileStatus').textContent = 'Loaded';
                    document.getElementById('fileSize').textContent = '2.8 MB';
                },
                undefined,
                function(error) {
                    console.error('Error loading model:', error);
                    document.getElementById('loadingIndicator').innerHTML = `
                        <div style="color: #ff6b6b; margin-bottom: 15px; font-size: 40px;">⚠️</div>
                        <p>Cannot load model</p>
                        <p style="font-size: 14px; margin-top: 10px;">Please make sure the file exists: ${modelPath}</p>
                    `;
                    document.getElementById('statusText').textContent = 'Error loading';
                }
            );
        }
        
        function centerModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            model.position.x -= center.x;
            model.position.y -= center.y;
            model.position.z -= center.z;
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
            cameraZ *= 1.8;
            
            camera.position.z = cameraZ;
            
            controls.update();
        }
        
        function resetView() {
            if (model) {
                camera.position.set(0, 0, 5);
                controls.reset();
                centerModel(model);
            }
        }

        function onWindowResize() {
            camera.aspect = document.querySelector('.viewer-container').offsetWidth / 
                            document.querySelector('.viewer-container').offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(
                document.querySelector('.viewer-container').offsetWidth, 
                document.querySelector('.viewer-container').offsetHeight
            );
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                model.rotation.y += 0.005;
            }
            if (controls) {
                controls.update();
            }
            renderer.render(scene, camera);
        }
        
        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
