<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent: #4facfe;
            --accent2: #00f2fe;
            --bg: #080b12;
            --surface: rgba(8, 11, 18, 0.82);
            --border: rgba(79, 172, 254, 0.18);
            --text: #e8f4ff;
            --text-muted: #6b8fa8;
        }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas { display: block; }
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(79,172,254,0.08) 0%, transparent 70%);
        }
        .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
        .title-bar { display: flex; align-items: center; gap: 0.75rem; pointer-events: none; }
        .title-bar h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 0.15em; text-transform: uppercase; text-shadow: 0 0 20px var(--accent); }
        .title-bar h1 span { color: var(--accent); font-weight: 700; }
        .card {
            background: var(--surface); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.15rem;
            pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.45);
        }
        .row { display: flex; justify-content: space-between; gap: 1.5rem; font-size: 0.85rem; margin-bottom: 0.45rem; }
        .row:last-child { margin-bottom: 0; }
        .row .label { color: var(--text-muted); }
        .row .value { color: var(--accent); font-weight: 600; }
        .card h3 { color: var(--accent); font-size: 0.95rem; margin-bottom: 0.7rem; display: flex; align-items: center; gap: 8px; }
        .info-list { list-style: none; font-size: 0.85rem; }
        .info-list li { margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; }
        .info-list li:last-child { margin-bottom: 0; }
        .info-icon { color: var(--accent); font-weight: 700; width: 18px; text-align: center; }
        .model-panel { position: absolute; top: 4.25rem; left: 1.25rem; width: 280px; }
        .controls-panel { position: absolute; bottom: 1.25rem; left: 1.25rem; width: 260px; }
        .status-pill {
            position: absolute; top: 1.4rem; right: 1.25rem;
            display: flex; align-items: center; gap: 8px;
            background: var(--surface); backdrop-filter: blur(18px);
            border: 1px solid var(--border); border-radius: 999px;
            padding: 0.5rem 1rem; font-size: 0.82rem;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6b6b; transition: all 0.3s; }
        .dot.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            text-align: center; background: var(--surface); backdrop-filter: blur(18px);
            border: 1px solid var(--border); border-radius: 18px;
            padding: 2rem 2.5rem; z-index: 20;
        }
        .spinner {
            width: 46px; height: 46px; margin: 0 auto 1rem;
            border: 4px solid rgba(79,172,254,0.2); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-row { position: absolute; bottom: 1.25rem; right: 1.25rem; display: flex; gap: 0.5rem; pointer-events: auto; }
        .btn {
            background: rgba(79,172,254,0.15); color: var(--text);
            border: 1px solid rgba(79,172,254,0.4); padding: 0.6rem 1.2rem;
            border-radius: 999px; cursor: pointer; font-size: 0.85rem;
            backdrop-filter: blur(12px); transition: all 0.25s;
        }
        .btn:hover { background: rgba(79,172,254,0.3); transform: translateY(-2px); }
        .btn.active { background: var(--accent); color: #04121f; font-weight: 600; }
        @media (max-width: 768px) {
            .model-panel, .controls-panel { display: none; }
            .title-bar h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div class="hud">
        <div class="title-bar">
            <h1>GLB <span>Viewer</span></h1>
        </div>
        <div class="model-panel card">
            <h3>🌌 Model Info</h3>
            <div class="row"><span class="label">File</span><span class="value" id="fileName">my-room.glb</span></div>
            <div class="row"><span class="label">Status</span><span class="value" id="fileStatus">Loading…</span></div>
            <div class="row"><span class="label">Meshes</span><span class="value" id="meshCount">—</span></div>
            <div class="row"><span class="label">Triangles</span><span class="value" id="triCount">—</span></div>
        </div>
        <div class="controls-panel card">
            <h3>🎮 Controls</h3>
            <ul class="info-list">
                <li><span class="info-icon">🖱</span> Drag to orbit</li>
                <li><span class="info-icon">⧉</span> Scroll to zoom</li>
                <li><span class="info-icon">✥</span> Right-drag to pan</li>
            </ul>
        </div>
        <div class="status-pill">
            <div class="dot" id="statusIndicator"></div>
            <span id="statusText">Connecting…</span>
        </div>
        <div class="btn-row">
            <button class="btn" id="autoRotateBtn" title="Toggle auto-rotate">⟳ Auto-rotate</button>
            <button class="btn" id="resetBtn">Reset view</button>
        </div>
    </div>
    <div class="loading" id="loadingIndicator">
        <div class="spinner"></div>
        <p>Loading 3D model…</p>
    </div>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const $ = (id) => document.getElementById(id);
    const modelPath = 'my-room.glb';

    let scene, camera, renderer, controls, model;
    let autoRotate = false;

    function createStarfield() {
        const starGeometry = new THREE.BufferGeometry();
        const starVertices = [];
        for (let i = 0; i < 10000; i++) {
            starVertices.push(
                THREE.MathUtils.randFloatSpread(2000),
                THREE.MathUtils.randFloatSpread(2000),
                THREE.MathUtils.randFloatSpread(2000)
            );
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0x444444, size: 1.5, sizeAttenuation: true })));

        bigGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        bigGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        scene.add(new THREE.Points(bigGeo, new THREE.PointsMaterial({ size: 3, sizeAttenuation: true, vertexColors: true })));

        const nebulaGeo = new THREE.SphereGeometry(500, 32, 32);
        const nebula1 = new THREE.Mesh(nebulaGeo, new THREE.MeshBasicMaterial({ color: 0x4facfe, transparent: true, opacity: 0.05 }));
        nebula1.position.set(300, -200, -500);
        scene.add(nebula1);
        const nebula2 = new THREE.Mesh(nebulaGeo, new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.03 }));
        nebula2.position.set(-400, 300, 600);
        nebula2.scale.setScalar(1.5);
        scene.add(nebula2);
    }

    function init() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x080b12, 0.0004);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(0, 0, 15);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        $('viewer').appendChild(renderer.domElement);

        createStarfield();

        scene.add(new THREE.AmbientLight(0x888888, 0.6));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(5, 5, 5);
        scene.add(keyLight);
        const fillLight = new THREE.PointLight(0x4facfe, 30, 100);
        fillLight.position.set(10, 10, 10);
        scene.add(fillLight);
        const rimLight = new THREE.PointLight(0x888888, 0.5, 20);
        rimLight.position.set(-10, -10, -10);
        scene.add(rimLight);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.minDistance = 0.1;
        controls.maxDistance = 1000;

        window.addEventListener('resize', onWindowResize);
        loadModel();

        $('resetBtn').addEventListener('click', resetView);
        $('autoRotateBtn').addEventListener('click', (e) => {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.8;
            e.currentTarget.classList.toggle('active', autoRotate);
        });
    }

    function loadModel() {
        $('statusText').textContent = 'Loading model…';
        const loader = new GLTFLoader();
        loader.load(modelPath, (gltf) => {
            model = gltf.scene;
            centerModel(model);
            model.traverse((node) => {
                if (node.isMesh) node.material.emissive = new THREE.Color(0x111111);
            });
            scene.add(model);
            $('loadingIndicator').style.display = 'none';
            $('statusText').textContent = 'Connected';
            $('statusIndicator').classList.add('active');
            $('fileStatus').textContent = 'Loaded ✓';
            let meshCount = 0, triCount = 0;
            model.traverse((n) => {
                if (n.isMesh) {
                    meshCount++;
                    if (n.geometry.index) triCount += n.geometry.index.count / 3;
                    else if (n.geometry.attributes.position) triCount += n.geometry.attributes.position.count / 3;
                }
            });
            $('meshCount').textContent = meshCount;
            $('triCount').textContent = Math.round(triCount).toLocaleString();
        }, undefined, (error) => {
            console.error('Error loading model:', error);
            $('loadingIndicator').innerHTML = '<div style="font-size:40px;margin-bottom:12px">⚠️</div><p>Cannot load model</p><p style="font-size:0.85rem;margin-top:8px;color:var(--text-muted)">File: ' + modelPath + '</p>';
            $('statusText').textContent = 'Connection error';
        });
    }

    function centerModel(m) {
        const box = new THREE.Box3().setFromObject(m);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        m.position.x -= center.x; m.position.y -= center.y; m.position.z -= center.z;
        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = camera.fov * (Math.PI / 180);
        camera.position.z = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * 1.8;
        controls.update();
    }

    function resetView() { if (model) { centerModel(model); controls.reset(); } }
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        renderer.render(scene, camera);
    }
    init();
    animate();
</script>
</body>
</html>
