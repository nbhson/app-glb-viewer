<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space 3D Model Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        #viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px 40px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #4facfe;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            max-width: 300px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-title {
            color: #4facfe;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-list {
            list-style-type: none;
        }
        
        .info-list li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-icon {
            color: #4facfe;
            font-weight: bold;
            font-size: 18px;
        }
        
        .title {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 32px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 300;
            z-index: 10;
            text-shadow: 0 0 10px rgba(79, 172, 254, 0.7);
        }
        
        .title span {
            color: #4facfe;
            font-weight: bold;
        }
        
        .status-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b6b;
        }
        
        .status-indicator.active {
            background: #4facfe;
            box-shadow: 0 0 10px #4facfe;
        }
        
        .model-info {
            position: absolute;
            top: 70px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        
        .model-info h3 {
            color: #4facfe;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            min-width: 250px;
        }
        
        .info-label {
            opacity: 0.8;
        }
        
        .info-value {
            font-weight: 500;
            color: #4facfe;
        }
        
        .nebula-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, 
                rgba(79, 172, 254, 0.1) 0%, 
                rgba(79, 172, 254, 0.05) 40%, 
                rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }
        
        .reset-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(79, 172, 254, 0.2);
            color: white;
            border: 1px solid rgba(79, 172, 254, 0.5);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .reset-btn:hover {
            background: rgba(79, 172, 254, 0.3);
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 24px;
                top: 10px;
            }
            
            .status-bar {
                top: 10px;
                right: 10px;
                font-size: 12px;
            }
            
            .controls-info {
                font-size: 14px;
                bottom: 10px;
                left: 10px;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nebula-overlay"></div>
        <div id="viewer"></div>
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>Loading space model...</p>
        </div>
        
        <div class="status-bar" id="statusBar">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Connecting...</span>
        </div>
        
        <div class="model-info">
            <h3>🌌 Model Info</h3>
            <div class="info-row">
                <span class="info-label">File name:</span>
                <span class="info-value" id="fileName">spaceship.glb</span>
            </div>
            <div class="info-row">
                <span class="info-label">Status:</span>
                <span class="info-value" id="fileStatus">Loading...</span>
            </div>
        </div>
        
        <button class="reset-btn" id="resetBtn">Reset view</button>
    </div>

    <script>
        let scene, camera, renderer, controls, model;
        let stars = [];
        const modelPath = 'my-room.glb';  
        
        function createStarfield() {
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({
                color: 0x444444,
                size: 1.5,
                sizeAttenuation: true
            });
            
            const starVertices = [];
            for (let i = 0; i < 10000; i++) {
                const x = THREE.MathUtils.randFloatSpread(2000);
                const y = THREE.MathUtils.randFloatSpread(2000);
                const z = THREE.MathUtils.randFloatSpread(2000);
                starVertices.push(x, y, z);
            }
            
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const starField = new THREE.Points(starGeometry, starMaterial);
            scene.add(starField);
            
            const bigStarsGeometry = new THREE.BufferGeometry();
            const bigStarsMaterial = new THREE.PointsMaterial({
                size: 3,
                sizeAttenuation: true,
                vertexColors: true
            });
            
            const bigStarsVertices = [];
            const bigStarsColors = [];
            for (let i = 0; i < 500; i++) {
                const x = THREE.MathUtils.randFloatSpread(1800);
                const y = THREE.MathUtils.randFloatSpread(1800);
                const z = THREE.MathUtils.randFloatSpread(1800);
                bigStarsVertices.push(x, y, z);
                
                const colorRand = Math.random();
                if (colorRand < 0.7) {
                    bigStarsColors.push(1, 1, 1); // trắng
                } else if (colorRand < 0.85) {
                    bigStarsColors.push(0.6, 0.8, 1); // xanh nhạt
                } else if (colorRand < 0.95) {
                    bigStarsColors.push(1, 0.8, 0.6); // cam nhạt
                } else {
                    bigStarsColors.push(1, 0.6, 0.6); // đỏ nhạt
                }
            }
            
            bigStarsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(bigStarsVertices, 3));
            bigStarsGeometry.setAttribute('color', new THREE.Float32BufferAttribute(bigStarsColors, 3));
            const bigStars = new THREE.Points(bigStarsGeometry, bigStarsMaterial);
            scene.add(bigStars);
            
            const nebulaGeometry = new THREE.SphereGeometry(500, 32, 32);
            const nebulaMaterial = new THREE.MeshBasicMaterial({
                color: 0x4facfe,
                transparent: true,
                opacity: 0.05
            });
            const nebula = new THREE.Mesh(nebulaGeometry, nebulaMaterial);
            nebula.position.set(300, -200, -500);
            scene.add(nebula);
            
            const nebula2 = new THREE.Mesh(nebulaGeometry, nebulaMaterial);
            nebula2.position.set(-400, 300, 600);
            nebula2.scale.set(1.5, 1.5, 1.5);
            nebula2.material.color.set(0xff6b6b);
            nebula2.material.opacity = 0.03;
            scene.add(nebula2);
        }
        
        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(
                75, 
                window.innerWidth / window.innerHeight, 
                0.1, 
                3000
            );
            camera.position.set(0, 0, 15);
            
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('viewer').appendChild(renderer.domElement);
            
            createStarfield();
            
            const ambientLight = new THREE.AmbientLight(0x888888, 0.3);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0x888888, 0.5);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);
            
            const pointLight1 = new THREE.PointLight(0x4facfe, 0.5, 100);
            pointLight1.position.set(10, 10, 10);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0x888888, 0.5, 20);
            pointLight2.position.set(-10, -10, -10);
            scene.add(pointLight2);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;
            controls.zoomSpeed = 1.2;
            controls.panSpeed = 0.8;

            controls.minDistance = 0.1;
            controls.maxDistance = 1000;
            
            window.addEventListener('resize', onWindowResize);
            
            loadModel();
            
            document.getElementById('resetBtn').addEventListener('click', resetView);
        }
        
        function loadModel() {
            document.getElementById('statusText').textContent = 'Loading model...';
            
            const loader = new THREE.GLTFLoader();
            
            loader.load(
                modelPath,
                function(gltf) {
                    model = gltf.scene;
                    
                    centerModel(model);
                    
                    model.traverse(function(node) {
                        if (node.isMesh) {
                            node.material.emissive = new THREE.Color(0x111111);
                            node.material.emissiveIntensity = 0.2;
                        }
                    });
                    
                    scene.add(model);
                    
                    document.getElementById('loadingIndicator').style.display = 'none';
                    
                    document.getElementById('statusText').textContent = 'Connected';
                    document.getElementById('statusIndicator').classList.add('active');
                    document.getElementById('fileStatus').textContent = 'Loaded';
                },
                undefined,
                function(error) {
                    console.error('Error loading model:', error);
                    document.getElementById('loadingIndicator').innerHTML = `
                        <div style="color: #ff6b6b; margin-bottom: 15px; font-size: 40px;">⚠️</div>
                        <p>Cannot load model</p>
                        <p style="font-size: 14px; margin-top: 10px;">Please make sure the file exists: ${modelPath}</p>
                    `;
                    document.getElementById('statusText').textContent = 'Connection error';
                }
            );
        }
        
        function centerModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            model.position.x -= center.x;
            model.position.y -= center.y;
            model.position.z -= center.z;
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
                        cameraZ *= 1.8;
            
            camera.position.z = cameraZ;
            
            controls.update();
        }
        
        function resetView() {
            if (model) {
                camera.position.set(0, 0, 15);
                
                controls.reset();
                
                centerModel(model);
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (controls) {
                controls.update();
            }
            
            camera.position.x += 0.005;
            // camera.position.y += 0.0003;
            
            renderer.render(scene, camera);
        }
        
        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
